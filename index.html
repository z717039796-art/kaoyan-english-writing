<title>考研复习书房</title>

<style>
:root {
  color-scheme: light;
  --paper: #f6f3ec;
  --ink: #243129;
  --muted: #475047;
  --rust: #9c4128;
  --line: #414940;
  --sand: #ebdcc5;
  --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", STSong, SimSun, serif;
  --roman: Georgia, "Times New Roman", serif;
  --gutter: clamp(18px, 4.15vw, 64px);
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
[hidden] { display: none !important; }
a { color: inherit; }
a:focus-visible { outline: 3px solid var(--rust); outline-offset: 4px; }
.frame { width: min(1408px, calc(100% - 2 * var(--gutter))); margin-inline: auto; }
.masthead { min-height: 80px; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 8px 10px 10px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 17px; font-size: clamp(25px, 2.48vw, 38px); font-weight: 800; letter-spacing: .035em; white-space: nowrap; }
.brand-mark { width: clamp(42px, 3.8vw, 58px); height: auto; flex: none; }
.top-nav { display: flex; align-items: center; gap: clamp(18px, 2.25vw, 35px); font-size: clamp(15px, 1.45vw, 22px); white-space: nowrap; }
.top-nav a { display: inline-flex; gap: 7px; align-items: center; min-height: 44px; text-decoration: none; color: var(--rust); }
.top-nav a:hover { text-decoration: underline; text-underline-offset: 4px; }
.nav-year { padding-inline-end: clamp(18px, 2.25vw, 35px); border-inline-end: 1px solid var(--line); }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 28px; padding: clamp(35px, 3.08vw, 47px) 3% clamp(29px, 2.55vw, 39px) 7.65%; }
.hero h1 { font-size: clamp(50px, 6.2vw, 95px); font-weight: 800; letter-spacing: .045em; line-height: 1.06; }
.hero-intro { margin-top: clamp(16px, 1.55vw, 24px); font-size: clamp(19px, 1.88vw, 28px); font-weight: 500; line-height: 1.43; letter-spacing: .065em; }
.hero-intro span { display: block; }
.countdown { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 6px; width: clamp(215px, 23.1vw, 355px); min-height: clamp(140px, 12.2vw, 187px); padding: 14px clamp(21px, 2.82vw, 43px); background: var(--sand); border-radius: clamp(20px, 1.82vw, 28px); }
@media (min-width: 721px) { .countdown { transform: translateY(clamp(7px, 1.31vw, 20px)); } }
.countdown-label { font-size: clamp(17px, 1.55vw, 24px); line-height: 1.2; font-weight: 700; letter-spacing: .04em; }
.countdown-reading { display: flex; align-items: baseline; gap: 12px; }
.countdown-number { color: var(--rust); font: 400 clamp(56px, 7vw, 106px)/.85 var(--roman); font-variant-numeric: lining-nums tabular-nums; }
.countdown-unit { font-size: clamp(20px, 2.12vw, 32px); }
.countdown-dates { font: 400 clamp(16px, 1.55vw, 24px)/1.25 var(--roman); white-space: nowrap; }
.entry-title { display: flex; align-items: center; gap: 21px; margin: 0 0 clamp(15px, 1.65vw, 25px); font-size: clamp(23px, 2.26vw, 35px); line-height: 1.25; letter-spacing: .06em; }
.entry-title::after { content: ""; height: 1px; background: var(--line); flex: 1; }
.entry-grid { display: grid; grid-template-columns: 1.17fr 1fr; grid-template-rows: repeat(2, minmax(0, 1fr)); gap: clamp(12px, 1.15vw, 18px); min-height: clamp(355px, 31.9vw, 490px); }
.entry-card { position: relative; isolation: isolate; min-width: 0; overflow: hidden; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: clamp(22px, 2vw, 31px); background: var(--paper); text-decoration: none; transition: box-shadow .22s ease, border-color .22s ease; }
.entry-card:hover { border-color: var(--ink); box-shadow: 0 6px 22px #24312917; }
.entry-card--art { grid-row: span 2; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
.entry-card--art .entry-artwork { position: relative; min-height: 190px; overflow: hidden; background: #a7ad91; }
.entry-artwork img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .33s ease; }
.entry-card--art img { position: absolute; inset: 0; object-position: center 52%; }
.entry-card:hover .entry-artwork img { transform: scale(1.035); }
.entry-copy { position: relative; z-index: 1; }
.entry-card--art .entry-copy { padding: clamp(12px, .85vw, 13px) clamp(21px, 2vw, 31px) clamp(16px, 1.12vw, 17px); padding-inline-end: clamp(76px, 6.6vw, 104px); }
.entry-card--small .entry-copy { display: flex; flex-direction: column; align-items: flex-start; flex: 1; padding: clamp(16px, 1.57vw, 24px) 0 clamp(16px, 1.57vw, 24px) clamp(21px, 1.96vw, 30px); margin-inline-end: 41%; }
.entry-card--small .entry-artwork { position: absolute; z-index: -1; inset: 0 0 0 47%; overflow: hidden; clip-path: polygon(14% 0, 100% 0, 100% 100%, 0 100%); background: #efba97; }
.entry-card--board .entry-artwork { inset-inline-start: 39%; clip-path: polygon(25% 0, 100% 0, 100% 100%, 0 100%); background: #e7b76a; }
.entry-code { font: 700 clamp(11px, 1.2vw, 18px)/1.15 var(--roman); color: var(--rust); white-space: nowrap; }
.entry-name { margin-top: clamp(5px, .6vw, 9px); font-size: clamp(24px, 2.53vw, 39px); font-weight: 800; line-height: 1.19; letter-spacing: .035em; }
.entry-card--art .entry-name { font-size: clamp(32px, 3.4vw, 52px); }
.entry-desc { margin-top: clamp(4px, .66vw, 10px); font-size: clamp(14px, 1.46vw, 22px); line-height: 1.4; letter-spacing: .03em; color: var(--ink); }
.entry-arrow { display: grid; place-items: center; width: clamp(35px, 3.02vw, 46px); height: clamp(35px, 3.02vw, 46px); border: 1.5px solid var(--ink); border-radius: 50%; transition: background .2s ease, color .2s ease; }
.entry-arrow svg { width: 58%; height: auto; }
.entry-card--small .entry-arrow { margin-top: auto; }
.entry-card--small .entry-desc { margin-bottom: 13px; }
.entry-card--art .entry-arrow { position: absolute; right: clamp(19px, 1.9vw, 29px); bottom: clamp(15px, 1.4vw, 22px); width: clamp(44px, 3.9vw, 60px); height: clamp(44px, 3.9vw, 60px); background: var(--ink); color: var(--paper); }
.entry-card--small:hover .entry-arrow, .entry-card--small:focus-visible .entry-arrow { background: var(--ink); color: var(--paper); }
.entry-card--art:hover .entry-arrow, .entry-card--art:focus-visible .entry-arrow { background: var(--rust); border-color: var(--rust); }
.footer { display: flex; gap: 12px; justify-content: space-between; padding: 11px 3px 22px; margin-top: clamp(22px, 2.35vw, 36px); border-top: 1px solid var(--line); font-size: clamp(13px, 1.25vw, 19px); letter-spacing: .045em; color: var(--muted); }
@media (max-width: 900px) {
  .masthead { min-height: 66px; padding-inline: 0; }
  .hero { padding-inline: 3%; }
  .entry-grid { min-height: 340px; }
}
@media (max-width: 720px) {
  .hero { padding: 32px 0 28px; grid-template-columns: 1fr; gap: 20px; }
  .hero h1 { font-size: clamp(41px, 8.6vw, 59px); letter-spacing: .035em; }
  .hero-intro { font-size: clamp(17px, 4.4vw, 21px); margin-top: 11px; letter-spacing: .04em; }
  .countdown { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; column-gap: 12px; row-gap: 5px; width: 100%; min-height: 0; align-items: center; padding: 16px 19px; }
  .countdown-reading { grid-column: 2; grid-row: 1 / 3; gap: 5px; }
  .countdown-number { font-size: 47px; }
  .countdown-unit { font-size: 17px; }
  .countdown-dates { grid-column: 1; grid-row: 2; }
  .entry-grid { display: flex; flex-direction: column; gap: 13px; }
  .entry-card--art { grid-template-rows: auto auto; }
  .entry-card--art .entry-artwork { min-height: 0; aspect-ratio: 2.13; }
  .entry-card--art .entry-copy { padding: 14px 67px 18px 17px; }
  .entry-card--art .entry-name { font-size: 32px; }
  .entry-card--art .entry-arrow { right: 15px; bottom: 16px; }
  .entry-card--small .entry-copy { padding: 15px 0 15px 17px; min-height: 139px; }
  .entry-card--small .entry-artwork { inset-inline-start: 53%; }
  .entry-card--board .entry-artwork { inset-inline-start: 42%; }
  .footer { margin-top: 24px; }
}
@media (max-width: 410px) { .nav-year { display: none; } }
@media (max-width: 380px) {
  .brand { font-size: 23px; gap: 9px; }
  .brand-mark { width: 35px; }
  .hero h1 { font-size: clamp(35px, 10.45vw, 41px); }
  .entry-card--small .entry-artwork { inset-inline-start: 55%; }
  .entry-card--board .entry-artwork { inset-inline-start: 42%; }
  .entry-card--small .entry-name { font-size: 20px; }
  .footer { flex-direction: column; gap: 5px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>

<script>
(() => {
  // 按北京时间的日历日计数。初试日期：研招网 /yzwb/。
  const examStart = Date.UTC(2026, 11, 19);
  const examEnd = Date.UTC(2026, 11, 20);
  const beijingDate = new Intl.DateTimeFormat('zh-CN', {
    timeZone: 'Asia/Shanghai', year: 'numeric', month: 'numeric', day: 'numeric'
  });
  const label = document.getElementById('countdownLabel');
  const reading = document.getElementById('countdownReading');
  const days = document.getElementById('countdownDays');
  function updateCountdown() {
    const parts = Object.fromEntries(beijingDate.formatToParts(new Date()).map(({type, value}) => [type, value]));
    const today = Date.UTC(Number(parts.year), Number(parts.month) - 1, Number(parts.day));
    reading.hidden = today >= examStart;
    if (today < examStart) {
      label.textContent = '距 2027 考研初试';
      days.textContent = String((examStart - today) / 86400000);
    } else {
      label.textContent = today <= examEnd ? '2027 考研初试日' : '2027 考研初试已结束';
    }
  }
  updateCountdown();
  setInterval(updateCountdown, 60000);
  window.addEventListener('pageshow', updateCountdown);
})();
</script>
